<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="512" height="512" viewBox="0 0 512 512">
  <title>Solar — File Manager</title>
  <defs>
    <linearGradient id="grad-trasera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="grad-frontal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <g id="capa-carpeta-trasera" inkscape:groupmode="layer" inkscape:label="Carpeta trasera">
