    <line id="rayo-1" x1="270.0" y1="242.0" x2="270.0" y2="218.0"/>
    <line id="rayo-2" x1="312.4" y1="259.6" x2="329.4" y2="242.6"/>
    <line id="rayo-3" x1="330.0" y1="302.0" x2="354.0" y2="302.0"/>
    <line id="rayo-4" x1="312.4" y1="344.4" x2="329.4" y2="361.4"/>
    <line id="rayo-5" x1="270.0" y1="362.0" x2="270.0" y2="386.0"/>
    <line id="rayo-6" x1="227.6" y1="344.4" x2="210.6" y2="361.4"/>
    <line id="rayo-7" x1="210.0" y1="302.0" x2="186.0" y2="302.0"/>
    <line id="rayo-8" x1="227.6" y1="259.6" x2="210.6" y2="242.6"/>
  </g>

  <g id="capa-sol-nucleo" inkscape:groupmode="layer" inkscape:label="Sol - núcleo" transform="translate(270 302) skewX(-14) translate(-270 -302)">
    <circle id="sol-nucleo" cx="270" cy="302" r="40" fill="#C2410C"/>
  </g>
