          d="M144 176 H424 Q448 176 448 200 V400 Q448 424 424 424 H90 Q62 424 68 398 L120 194 Q125 176 144 176 Z"/>
  </g>

  <g id="capa-sol-rayos" inkscape:groupmode="layer" inkscape:label="Sol - rayos" transform="translate(270 302) skewX(-14) translate(-270 -302)"
